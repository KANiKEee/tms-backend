server:
  port: ${SERVER_PORT:8085}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tms_gateway_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:000}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:TmsMiniSecretKeyForJwtTokenGeneration2024VeryLongSecureKey!!}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
