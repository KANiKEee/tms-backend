databases:
  - name: gateway-db
    plan: free
    databaseName: tms_gateway_db
    user: tms_user

  - name: personnel-db
    plan: free
    databaseName: tms_personnel_db
    user: tms_user

  - name: camion-db
    plan: free
    databaseName: tms_camion_db
    user: tms_user

  - name: mission-db
    plan: free
    databaseName: tms_mission_db
    user: tms_user

services:
  # ==================== GATEWAY ====================
  - type: web
    name: tms-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./tms-gateway/Dockerfile
    dockerContext: ./tms-gateway
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: gateway-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gateway-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: gateway-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: gateway-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gateway-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000

  # ==================== PERSONNEL ====================
  - type: web
    name: tms-personnel
    runtime: docker
    plan: free
    dockerfilePath: ./tms-personnel/Dockerfile
    dockerContext: ./tms-personnel
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: personnel-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: personnel-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: personnel-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: personnel-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: personnel-db
          property: password
      - key: JWT_SECRET
        generateValue: true

  # ==================== CAMION ====================
  - type: web
    name: tms-camion
    runtime: docker
    plan: free
    dockerfilePath: ./tms-camion/Dockerfile
    dockerContext: ./tms-camion
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: camion-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: camion-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: camion-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: camion-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: camion-db
          property: password
      - key: JWT_SECRET
        generateValue: true

  # ==================== MISSION ====================
  - type: web
    name: tms-mission
    runtime: docker
    plan: free
    dockerfilePath: ./tms-mission/Dockerfile
    dockerContext: ./tms-mission
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: mission-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mission-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: mission-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: mission-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mission-db
          property: password
      - key: JWT_SECRET
        generateValue: true
