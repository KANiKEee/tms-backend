server:
  port: ${SERVER_PORT:8087}

spring:
  datasource:
    url: ${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/tms_camion_db}}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:000}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:TmsMiniSecretKeyForJwtTokenGeneration2024VeryLongSecureKey!!}

logging:
  level:
    com.tms.camion.config: DEBUG
    org.springframework.security: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
